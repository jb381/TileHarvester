# First-time setup: docker compose run --rm tileharvester auth
# Historical activities: docker compose run --rm tileharvester backfill
# Start syncing: docker compose up -d
# Follow logs: docker compose logs -f
# Check status: docker compose run --rm tileharvester status
# Back up data: docker compose run --rm tileharvester backup /data/backup.db
services:
  tileharvester:
    image: ghcr.io/jb381/tileharvester:latest
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - TH_DATA_DIR=/data
    volumes:
      - tileharvester-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "tileharvester", "health", "--no-check-rate-limit"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tileharvester-data:
    driver: local
