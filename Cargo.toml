[package]
name = "tileharvester"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Automatically add Squadrats stats to Strava activities"
license = "MIT"
keywords = ["strava", "squadrats", "gps", "tiles", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
repository = "https://github.com/jb381/TileHarvester"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
dotenvy = "0.15"
encoding_rs = "0.8"
hex = "0.4"
open = "5"
polyline = "0.11"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
url = "2"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
predicates = "3"

[[bench]]
name = "engine_benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
